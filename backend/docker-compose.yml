version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: elearning
      POSTGRES_USER: elearning
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: always
    user: root
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/app:z
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DB_NAME: elearning
      DB_USER: elearning
      DB_PASSWORD: 123456
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: dev-secret-elearing
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

  celery_worker:
    build: .
    restart: always
    user: root
    command: celery -A backend worker -l info
    volumes:
      - ./:/app:z
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env
    environment:
      DB_NAME: elearning
      DB_USER: elearning
      DB_PASSWORD: 123456
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: dev-secret-elearing
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD", "true"]  # Celery worker doesn't expose HTTP; mark healthy by default

  celery_beat:
    build: .
    restart: always
    user: root
    command: celery -A backend beat -l info
    volumes:
      - ./:/app:z
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env
    environment:
      DB_NAME: elearning
      DB_USER: elearning
      DB_PASSWORD: 123456
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: dev-secret-elearing
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD", "true"]  # Celery beat doesn't expose HTTP; mark healthy by default

volumes:
  postgres_data:
  redis_data:
