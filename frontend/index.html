  <!-- Prevent dark mode flash - apply theme immediately before page renders -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        // Default to dark if no theme set (match theme.store.ts logic)
        if (theme === 'dark' || !theme) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* Critical CSS to prevent flash */
    html.dark { background-color: #020617; }
    html.dark body { background-color: #020617; color: #e2e8f0; }
    html.dark .teacher-page,
    html.dark .teacher-page main,
    html.dark .teacher-page > div { background-color: #020617 !important; }
    html:not(.dark) { background-color: #f8fafc; }
    html:not(.dark) body { background-color: #f8fafc; }
    /* Prevent transition flash on initial load */
    html.dark * { transition: none !important; }
    html.dark.loaded * { transition: all 0.3s ease !important; }
  </style>
