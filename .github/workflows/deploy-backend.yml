name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m
          envs: BACKEND_ENV_FILE,BRANCH_NAME
          script: |
            set -euo pipefail
            BACKEND_ENV_FILE="${BACKEND_ENV_FILE:-}"
            BRANCH_NAME="${BRANCH_NAME:-main}"
            echo "Updating code..."
            cd /home/ubuntu/SunEdu
            echo "Current git remotes:"
            git remote -v || true
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin https://github.com/Lwents/SunEdu.git
            else
              git remote add origin https://github.com/Lwents/SunEdu.git
            fi
            echo "Cleaning up cache files and fixing permissions..."
            sudo chown -R ubuntu:ubuntu /home/ubuntu/SunEdu/backend || true
            find backend -path '*/\.venv' -prune -o -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
            find backend -path '*/\.venv' -prune -o -type f -name '*.pyc' -delete 2>/dev/null || true
            echo "Removing old local branch to avoid conflicts..."
            git checkout develop 2>/dev/null || git checkout -b develop origin/develop 2>/dev/null || true
            echo "Fetching latest changes for main..."
            git fetch --force origin main:refs/remotes/origin/main
            echo "Checking out main branch..."
            git checkout main 2>/dev/null || git checkout -b main origin/main
            git reset --hard origin/main
            echo "Current HEAD:"
            git --no-pager log -1 --oneline
            cd backend
            if [ -n "$BACKEND_ENV_FILE" ]; then
              echo "Creating .env from GitHub secrets..."
              echo "$BACKEND_ENV_FILE" > .env
              if ! grep -q "REDIS_HOST" .env; then
                echo "" >> .env
                echo "REDIS_HOST=redis" >> .env
                echo "REDIS_PORT=6379" >> .env
              fi
              if grep -q "CORS_ALLOWED_ORIGINS=" .env; then
                if ! grep "CORS_ALLOWED_ORIGINS=" .env | grep -q "api.smartedu.click"; then
                  sed -i 's|CORS_ALLOWED_ORIGINS=\(.*\)|CORS_ALLOWED_ORIGINS=\1,https://api.smartedu.click|' .env
                fi
              else
                echo "CORS_ALLOWED_ORIGINS=https://smartedu.click,https://www.smartedu.click,https://api.smartedu.click" >> .env
              fi
              if grep -q "CSRF_TRUSTED_ORIGINS=" .env; then
                if ! grep "CSRF_TRUSTED_ORIGINS=" .env | grep -q "api.smartedu.click"; then
                  sed -i 's|CSRF_TRUSTED_ORIGINS=\(.*\)|CSRF_TRUSTED_ORIGINS=\1,https://api.smartedu.click|' .env
                fi
              else
                echo "CSRF_TRUSTED_ORIGINS=https://smartedu.click,https://www.smartedu.click,https://api.smartedu.click" >> .env
              fi
              chmod 600 .env
              echo "Updated .env from GitHub secrets"
            elif [ -f ".env" ]; then
              echo "Using existing .env file"
            else
              echo "No .env configuration found!"
              exit 1
            fi
            mkdir -p logs runtime_logs media staticfiles
            chmod 777 logs runtime_logs media || true
            if [ -f "docker-compose.prod.yml" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            else
              COMPOSE_FILE="docker-compose.yml"
            fi
            echo "Deploying with Docker Compose..."
            sudo systemctl stop sunedu-backend 2>/dev/null || true
            sudo systemctl disable sunedu-backend 2>/dev/null || true
            sudo systemctl stop sunedu-celery 2>/dev/null || true
            sudo systemctl disable sunedu-celery 2>/dev/null || true
            sudo lsof -ti:8000 | xargs -r sudo kill -9 || true
            sudo lsof -ti:5432 | xargs -r sudo kill -9 || true
            sleep 2
            docker compose -f "$COMPOSE_FILE" down 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            echo "Building..."
            docker compose -f "$COMPOSE_FILE" build --no-cache
            echo "Starting services..."
            docker compose -f "$COMPOSE_FILE" up -d
            echo "Waiting for services..."
            for i in {1..30}; do
              if curl -f http://localhost:8000/health/ 2>/dev/null; then
                echo "Services are running"
                break
              fi
              sleep 3
            done
            echo "Container status:"
            docker compose -f "$COMPOSE_FILE" ps
            docker system prune -f || true
            echo "Deployment complete!"
            echo "Disabling any git push operations..."
            cd /home/ubuntu/SunEdu
            git config --local --unset-all remote.origin.pushurl 2>/dev/null || true
            echo "Git push disabled for this repo"
