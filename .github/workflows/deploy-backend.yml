name: Deploy Backend

on:
  push:
    branches: [main, develop]
  workflow_dispatch: {} # chạy tay khi cần

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m
          envs: BACKEND_ENV_FILE
          script: |
            set -euo pipefail

            echo "🧹 Cleaning up disk space..."

            # Show current disk usage
            echo "📊 Current disk usage:"
            df -h /

            # Clean Docker system (remove unused images, containers, volumes)
            echo "🐳 Cleaning Docker..."
            docker system prune -af --volumes || true

            # Clean old Python cache and pip cache
            echo "🐍 Cleaning Python cache..."
            find /var/www/SunEdu -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find /var/www/SunEdu -type f -name "*.pyc" -delete 2>/dev/null || true
            rm -rf ~/.cache/pip/* || true

            # Clean apt cache
            echo "📦 Cleaning apt cache..."
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/* || true

            # Show disk usage after cleanup
            echo "📊 Disk usage after cleanup:"
            df -h /

            echo "✅ Cleanup complete!"
            echo ""

            echo "📥 Updating code from Git..."
            cd /var/www/SunEdu
            git fetch origin main
            git reset --hard origin/main

            echo "🐍 Setting up Python virtual environment..."
            VENV="/var/www/SunEdu/backend/.venv"
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip --no-cache-dir
            "$VENV/bin/pip" install -r backend/requirements.txt --no-cache-dir

            cd backend

            # Sync environment configuration
            if [ -n "${BACKEND_ENV_FILE:-}" ]; then
              # Priority 1: Use GitHub secret
              printf '%s\n' "$BACKEND_ENV_FILE" > .env
              chmod 600 .env
              echo "✅ Updated .env from GitHub secrets"
            elif [ -f ".env.production" ]; then
              # Priority 2: Use .env.production from repo (auto-sync from git)
              echo "📋 Using .env.production from repository"
              cp .env.production .env
              chmod 600 .env
              
              # Override DB_HOST for Docker deployment
              if command -v docker >/dev/null 2>&1; then
                echo "🐳 Setting DB_HOST=db for Docker network"
                sed -i 's/DB_HOST=.*/DB_HOST=db/' .env
              fi
              
              # Merge with local overrides if exists
              if [ -f ".env.local.override" ]; then
                echo "🔀 Merging with .env.local.override"
                cat .env.local.override >> .env
              fi
              
              echo "✅ Created .env from .env.production"
            elif [ -f ".env" ]; then
              # Priority 3: Keep existing .env
              echo "⚠️  Using existing .env file"
            else
              echo "❌ No .env configuration found!"
              exit 1
            fi

            mkdir -p logs
            touch logs/ai_personalization.log

            # Use production docker-compose if available
            COMPOSE_FILE="docker-compose.prod.yml"
            if [ ! -f "$COMPOSE_FILE" ]; then
              COMPOSE_FILE="docker-compose.yml"
              echo "⚠️  docker-compose.prod.yml not found, using docker-compose.yml"
            fi

            if command -v docker >/dev/null 2>&1; then
              echo[object Object]Deploying with Docker Compose: $COMPOSE_FILE"

              # Stop old systemd services to free up ports
              if systemctl list-unit-files | grep -q '^sunedu-backend.service'; then
                echo "⏹️  Stopping sunedu-backend.service..."
                sudo systemctl stop sunedu-backend || true
                sudo systemctl disable sunedu-backend || true
              fi

              if systemctl list-unit-files | grep -q '^sunedu-celery.service'; then
                echo "⏹️  Stopping sunedu-celery.service..."
                sudo systemctl stop sunedu-celery || true
                sudo systemctl disable sunedu-celery || true
              fi

              # Kill any process using port 8000
              echo "🔍 Checking for processes on port 8000..."
              sudo lsof -ti:8000 | xargs -r sudo kill -9 || true

              # Kill any process using port 5432 (PostgreSQL)
              sudo lsof -ti:5432 | xargs -r sudo kill -9 || true

              # Wait a bit for ports to be freed
              sleep 2

              # Stop and remove old containers
              echo "🛑 Stopping old containers..."
              docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans || true

              # Remove old images to save space
              echo "🗑️ Removing old images..."
              docker images | grep sunedu | awk '{print $3}' | xargs -r docker rmi -f || true

              # Build with no-cache to ensure fresh build (but clean)
              echo "🔨 Building new images..."
              docker compose -f "$COMPOSE_FILE" build --no-cache --pull

              # Start all services (db + web)
              echo "🚀 Starting services..."
              docker compose -f "$COMPOSE_FILE" up -d

              # Wait for services to be healthy
              echo "⏳ Waiting for services to be healthy..."
              for i in {1..30}; do
                if docker compose -f "$COMPOSE_FILE" ps | grep -q "healthy"; then
                  echo "✅ Services are healthy"
                  break
                fi
                echo "⏳ Waiting... ($i/30)"
                sleep 3
              done

              # Show container status
              echo "📊 Container status:"
              docker compose -f "$COMPOSE_FILE" ps

              # Show final disk usage
              echo "📊 Final disk usage:"
              df -h /

              # Clean up build cache after deployment
              echo "🧹 Final cleanup..."
              docker builder prune -af || true

              echo "✅ Docker deployment complete!"
            else
              echo "❌ Docker not installed!"
              exit 1
            fi
