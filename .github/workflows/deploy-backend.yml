name: Deploy Backend

on:
  push:
    branches: [main, develop]
  workflow_dispatch: {} # chạy tay khi cần

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m
          envs: BACKEND_ENV_FILE
          script: |
            set -euo pipefail

            # Quick disk space check
            echo "📊 Current disk space:"
            DISK_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
            echo "Disk usage: ${DISK_USAGE}%"
            
            # Only cleanup if disk usage > 80%
            if [ "$DISK_USAGE" -gt 80 ]; then
              echo "🧹 Disk usage high (${DISK_USAGE}%), starting cleanup..."
              
              # Quick Docker cleanup (parallel where possible)
              if command -v docker >/dev/null 2>&1; then
                echo "🐳 Quick Docker cleanup..."
                docker container prune -f &> /dev/null || true
                docker image prune -a -f &> /dev/null || true
                docker volume prune -f &> /dev/null || true
              fi
              
              # Quick log cleanup (only very old files)
              find /var/www/SunEdu/backend/logs -type f -name "*.log" -mtime +30 -delete 2>/dev/null || true
              find /var/www/SunEdu/backend/runtime_logs -type f -name "*.log" -mtime +30 -delete 2>/dev/null || true
              
              echo "✅ Quick cleanup done"
            else
              echo "✅ Disk space OK, skipping cleanup"
            fi
            
            # Git operations (fast-forward only)
            cd /var/www/SunEdu
            echo "📥 Fetching latest changes..."
            git fetch origin main --depth=1
            git reset --hard origin/main

            # Optimize venv: reuse if exists, only update if needed
            VENV="/var/www/SunEdu/backend/.venv"
            REQUIREMENTS_HASH=$(md5sum backend/requirements.txt 2>/dev/null | cut -d' ' -f1 || echo "new")
            VENV_HASH_FILE="$VENV/.requirements_hash"
            
            if [ -d "$VENV" ] && [ -f "$VENV_HASH_FILE" ]; then
              OLD_HASH=$(cat "$VENV_HASH_FILE" 2>/dev/null || echo "")
              if [ "$REQUIREMENTS_HASH" = "$OLD_HASH" ]; then
                echo "✅ Virtual environment up to date, skipping reinstall"
                "$VENV/bin/pip" install --upgrade pip --quiet
              else
                echo "📦 Requirements changed, updating packages..."
                "$VENV/bin/pip" install --upgrade pip --quiet
                "$VENV/bin/pip" install -r backend/requirements.txt --quiet --no-cache-dir
                echo "$REQUIREMENTS_HASH" > "$VENV_HASH_FILE"
              fi
            else
              echo "📦 Creating new virtual environment..."
              rm -rf "$VENV"
              python3 -m venv "$VENV"
              "$VENV/bin/pip" install --upgrade pip --quiet
              "$VENV/bin/pip" install -r backend/requirements.txt --quiet --no-cache-dir
              echo "$REQUIREMENTS_HASH" > "$VENV_HASH_FILE"
            fi
            
            # Quick Python cache cleanup (non-blocking)
            find /var/www/SunEdu/backend -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null & || true

            cd backend

            # Sync environment configuration
            if [ -n "${BACKEND_ENV_FILE:-}" ]; then
              # Priority 1: Use GitHub secret
              printf '%s\n' "$BACKEND_ENV_FILE" > .env
              chmod 600 .env
              echo "✅ Updated .env from GitHub secrets"
            elif [ -f ".env.production" ]; then
              # Priority 2: Use .env.production from repo (auto-sync from git)
              echo "📋 Using .env.production from repository"
              cp .env.production .env
              chmod 600 .env
              
              # Override DB_HOST for Docker deployment
              if command -v docker >/dev/null 2>&1; then
                echo "🐳 Setting DB_HOST=db for Docker network"
                sed -i 's/DB_HOST=.*/DB_HOST=db/' .env
              fi
              
              # Merge with local overrides if exists
              if [ -f ".env.local.override" ]; then
                echo "🔀 Merging with .env.local.override"
                cat .env.local.override >> .env
              fi
              
              echo "✅ Created .env from .env.production"
            elif [ -f ".env" ]; then
              # Priority 3: Keep existing .env
              echo "⚠️  Using existing .env file"
            else
              echo "❌ No .env configuration found!"
              exit 1
            fi

            mkdir -p logs
            touch logs/ai_personalization.log

            # Use production docker-compose if available
            COMPOSE_FILE="docker-compose.prod.yml"
            if [ ! -f "$COMPOSE_FILE" ]; then
              COMPOSE_FILE="docker-compose.yml"
              echo "⚠️  docker-compose.prod.yml not found, using docker-compose.yml"
            fi

            if command -v docker >/dev/null 2>&1; then
              echo "🐳 Deploying with Docker Compose: $COMPOSE_FILE"
              
              # Quick stop old services (parallel, non-blocking)
              {
                systemctl stop sunedu-backend 2>/dev/null || true
                systemctl disable sunedu-backend 2>/dev/null || true
              } &
              {
                systemctl stop sunedu-celery 2>/dev/null || true
                systemctl disable sunedu-celery 2>/dev/null || true
              } &
              
              # Kill processes on ports (non-blocking)
              sudo lsof -ti:8000 | xargs -r sudo kill -9 2>/dev/null || true
              sudo lsof -ti:5432 | xargs -r sudo kill -9 2>/dev/null || true
              
              # Wait for background jobs
              wait
              
              # Stop old containers (with timeout)
              timeout 15 docker compose -f "$COMPOSE_FILE" down 2>/dev/null || docker compose -f "$COMPOSE_FILE" down || true
              
              # Build with cache and start services
              echo "🔨 Building and starting services..."
              docker compose -f "$COMPOSE_FILE" build --parallel
              docker compose -f "$COMPOSE_FILE" up -d
              
              # Optimized health check (faster, smarter)
              echo "⏳ Waiting for services to be ready..."
              MAX_WAIT=45
              WAIT_COUNT=0
              while [ $WAIT_COUNT -lt $MAX_WAIT ]; do
                # Check if containers are running
                if docker compose -f "$COMPOSE_FILE" ps | grep -qE "Up.*\(healthy\)"; then
                  echo "✅ Services are healthy"
                  break
                elif docker compose -f "$COMPOSE_FILE" ps | grep -qE "Up.*running"; then
                  # If running but not healthy, wait a bit more then check if web responds
                  sleep 3
                  if curl -sf http://localhost:8000 >/dev/null 2>&1 || \
                     docker compose -f "$COMPOSE_FILE" exec -T web echo "ok" >/dev/null 2>&1; then
                    echo "✅ Services are ready"
                    break
                  fi
                fi
                sleep 2
                WAIT_COUNT=$((WAIT_COUNT + 2))
                if [ $((WAIT_COUNT % 10)) -eq 0 ]; then
                  echo "⏳ Still waiting... (${WAIT_COUNT}s/${MAX_WAIT}s)"
                fi
              done
              
              # Show container status
              docker compose -f "$COMPOSE_FILE" ps
              
              echo "✅ Docker deployment complete!"
            else
              echo "❌ Docker not installed!"
              exit 1
            fi
